name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Neuestes Xcode wählen
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos
          SDKV=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS-SDK: $SDKV"
          if [ "${SDKV%%.*}" -ge 27 ]; then echo "EXTRA_FLAGS=SDK27" >> "$GITHUB_ENV"; else echo "EXTRA_FLAGS=" >> "$GITHUB_ENV"; echo "::warning::Kein iOS-27-SDK am Runner – Apple-Intelligence-Feinprüfung wird ohne gebaut"; fi

      - name: Werkzeuge
        run: brew install xcodegen ldid

      - name: Projekt erzeugen
        run: xcodegen generate

      - name: Bauen (unsigniert)
        run: |
          set -o pipefail
          xcodebuild -project FotoSortierer.xcodeproj -scheme FotoSortierer \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="\$(inherited) $EXTRA_FLAGS" \
            build > build.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | head -60
          grep -q "BUILD SUCCEEDED" build.log

      - name: Entitlements eintragen + IPA packen
        run: |
          APP=build/Build/Products/Release-iphoneos/FotoSortierer.app
          ldid -SFotoSortierer.entitlements "$APP/FotoSortierer"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry Ablage.ipa Payload
          ls -lh Ablage.ipa

      - name: Build-Log bei Fehler
        if: failure()
        run: grep -E "error:" -A3 build.log | head -120 || true

      - uses: actions/upload-artifact@v4
        with:
          name: Ablage-ipa
          path: Ablage.ipa

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Ablage.ipa \
            --title "Ablage Build ${{ github.run_number }}" \
            --notes "Unsignierte IPA für SideStore/LiveContainer. Commit ${{ github.sha }}"
