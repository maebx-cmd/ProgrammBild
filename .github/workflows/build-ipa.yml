name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Modell aus dem Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: NSFW.mlpackage
          key: nsfw-mobilenet2-224-v1-${{ hashFiles('tools/convert_nsfw.py') }}
      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.10"
      - name: Herunterladen + umwandeln
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install -q "tensorflow-cpu==2.12.*" "coremltools==7.2" "numpy<1.24"
          curl -fL --retry 3 -o nsfw.zip https://github.com/GantMan/nsfw_model/releases/download/1.1.0/nsfw_mobilenet_v2_140_224.zip
          unzip -q nsfw.zip -d nsfw_src
          find nsfw_src -maxdepth 4 | head -40
          SRC=$(find nsfw_src -name saved_model.h5 | head -1)
          LBL=$(find nsfw_src -name class_labels.txt | head -1)
          echo "Quelle: $SRC"; echo "Klassen:"; cat "$LBL"
          python tools/convert_nsfw.py "$SRC" NSFW.mlpackage "$LBL"
      - uses: actions/upload-artifact@v4
        with:
          name: nsfw-model
          path: NSFW.mlpackage

  build:
    needs: model
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Neuestes Xcode wählen
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos
          SDKV=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS-SDK: $SDKV"
          if [ "${SDKV%%.*}" -ge 27 ]; then echo "EXTRA_FLAGS=SDK27" >> "$GITHUB_ENV"; else echo "EXTRA_FLAGS=" >> "$GITHUB_ENV"; echo "::warning::Kein iOS-27-SDK am Runner – Apple-Intelligence-Feinprüfung wird ohne gebaut"; fi

      - name: Modell einbinden
        uses: actions/download-artifact@v4
        with:
          name: nsfw-model
          path: model/NSFW.mlpackage

      - name: Werkzeuge
        run: brew install xcodegen ldid

      - name: Projekt erzeugen
        run: xcodegen generate

      - name: Bauen (unsigniert)
        run: |
          set -o pipefail
          xcodebuild -project FotoSortierer.xcodeproj -scheme FotoSortierer \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="\$(inherited) $EXTRA_FLAGS" \
            build > build.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | head -60
          grep -q "BUILD SUCCEEDED" build.log

      - name: Entitlements eintragen + IPA packen
        run: |
          APP=build/Build/Products/Release-iphoneos/FotoSortierer.app
          xcrun coremlcompiler compile model/NSFW.mlpackage "$APP"
          ls -d "$APP"/NSFW.mlmodelc && du -sh "$APP"/NSFW.mlmodelc
          ldid -SFotoSortierer.entitlements "$APP/FotoSortierer"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry Ablage.ipa Payload
          ls -lh Ablage.ipa

      - name: Build-Log bei Fehler
        if: failure()
        run: grep -E "error:" -A3 build.log | head -120 || true

      - uses: actions/upload-artifact@v4
        with:
          name: Ablage-ipa
          path: Ablage.ipa

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Ablage.ipa \
            --title "Ablage Build ${{ github.run_number }}" \
            --notes "Unsignierte IPA für SideStore/LiveContainer. Commit ${{ github.sha }}"
