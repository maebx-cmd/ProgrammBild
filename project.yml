name: FotoSortierer
options:
  bundleIdPrefix: at.luyten
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  FotoSortierer:
    type: application
    platform: iOS
    sources: [Sources]
    entitlements:
      path: FotoSortierer.entitlements
      properties:
        # Zugriff auf Apples On-Device-Erkennung sensibler Inhalte (wie NudeFndr)
        com.apple.developer.sensitivecontentanalysis.client: [analysis]
    info:
      path: Info.plist
      properties:
        # Neutraler Name am Homescreen
        CFBundleDisplayName: Ablage
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryUsageDescription: "Ablage analysiert deine Fotos ausschließlich auf diesem Gerät, um sie in Alben einzusortieren."
        NSPhotoLibraryAddUsageDescription: "Ablage legt Alben an und ordnet ausgewählte Fotos ein."
        NSFaceIDUsageDescription: "Ablage ist mit Face ID gesperrt."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.luyten.fotosortierer
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
